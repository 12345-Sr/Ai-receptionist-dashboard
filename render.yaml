services:
  - type: web
    name: kmc-hospital-ai-reception-dashboard
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: false
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: ai_receptionist
      - key: COLLECTION_NAME
        value: calllogs
      - key: DASH_USERS
        sync: false
      - key: DASH_USER
        sync: false
      - key: DASH_PASS
        sync: false
      - key: RECORDING_HOSTS
        value: 
      - key: RECORDING_AUTH
        sync: false
