services:
  - type: web
    name: ai-reception-dashboard
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BACKEND_API_URL
        sync: false
      - key: BACKEND_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: ai_receptionist
      - key: DASH_USER
        value: admin
      - key: DASH_PASS
        value: admin123
