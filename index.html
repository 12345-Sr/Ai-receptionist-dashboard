<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Patient Bookings</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef2f6;
            --card: #fff;
            --ink: #14212e;
            --mute: #5d6b7a;
            --line: #d9e0e8;
            --in: #0f6fb8;
            --out: #b8560f;
            --ok: #12805c;
            --no: #8a94a0;
            --okbg: #dff3ea;
            --nobg: #eceff2;
            --inbg: #dcecf8;
            --outbg: #f9e8da;
            --warn: #a4321a;
            --agent: #eef3fb;
            --user: #eef8f3;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0e1620;
                --card: #16222f;
                --ink: #e6edf4;
                --mute: #93a1b0;
                --line: #26364a;
                --in: #5db2f0;
                --out: #f0a05d;
                --ok: #4fd1a0;
                --no: #93a1b0;
                --okbg: #12342a;
                --nobg: #212e3c;
                --inbg: #12304a;
                --outbg: #402a15;
                --warn: #f0806a;
                --agent: #18283a;
                --user: #17302a
            }
        }

        :root[data-theme="dark"] {
            --bg: #0e1620;
            --card: #16222f;
            --ink: #e6edf4;
            --mute: #93a1b0;
            --line: #26364a;
            --in: #5db2f0;
            --out: #f0a05d;
            --ok: #4fd1a0;
            --no: #93a1b0;
            --okbg: #12342a;
            --nobg: #212e3c;
            --inbg: #12304a;
            --outbg: #402a15;
            --warn: #f0806a;
            --agent: #18283a;
            --user: #17302a
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 400 15px/1.5 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif
        }

        main {
            max-width: 860px;
            margin: 0 auto;
            padding: 20px 16px 40px
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px
        }

        h1 {
            font-size: 22px;
            margin: 0;
            font-weight: 700
        }

        .sub {
            color: var(--mute);
            font-size: 13px;
            margin: 2px 0 0;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok);
            display: inline-block;
            flex: none
        }

        .dot.bad {
            background: var(--warn)
        }

        button,
        input {
            font: inherit;
            color: var(--ink)
        }

        .btn {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer
        }

        .btn:hover {
            border-color: var(--mute)
        }

        .btn:focus-visible,
        input:focus-visible,
        .nameBtn:focus-visible {
            outline: 2px solid var(--in);
            outline-offset: 2px
        }

        input {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 12px;
            width: 100%;
            margin-bottom: 12px
        }

        .wrap {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px
        }

        th,
        td {
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap
        }

        th {
            font-size: 13px;
            color: var(--mute);
            font-weight: 500
        }

        tr:last-child td {
            border-bottom: 0
        }

        .nameBtn {
            background: none;
            border: 0;
            padding: 0;
            color: var(--in);
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            text-align: left
        }

        .nameBtn:hover {
            text-decoration: underline
        }

        .num {
            font-variant-numeric: tabular-nums
        }

        .empty,
        .err {
            padding: 28px;
            text-align: center;
            color: var(--mute)
        }

        .err {
            color: var(--warn)
        }

        /* detail overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 16, 24, .45);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 50
        }

        @media (min-width:640px) {
            .overlay {
                align-items: center
            }
        }

        .panel {
            background: var(--card);
            width: 100%;
            max-width: 560px;
            max-height: 88vh;
            border-radius: 14px 14px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        @media (min-width:640px) {
            .panel {
                border-radius: 14px
            }
        }

        .pHead {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line)
        }

        .pHead h2 {
            margin: 0 0 4px;
            font-size: 18px
        }

        .pHead p {
            margin: 0;
            color: var(--mute);
            font-size: 13px
        }

        .close {
            background: none;
            border: 0;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            color: var(--mute);
            padding: 4px
        }

        .pBody {
            padding: 16px 20px;
            overflow-y: auto
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            margin-bottom: 16px
        }

        .field span {
            display: block;
            color: var(--mute);
            font-size: 12px
        }

        .field b {
            font-size: 14px
        }

        .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 500
        }

        .in {
            background: var(--inbg);
            color: var(--in)
        }

        .out {
            background: var(--outbg);
            color: var(--out)
        }

        .yes {
            background: var(--okbg);
            color: var(--ok)
        }

        .nob {
            background: var(--nobg);
            color: var(--no)
        }

        .sectionTitle {
            font-size: 13px;
            color: var(--mute);
            margin: 0 0 8px;
            font-weight: 500
        }

        .summary {
            background: var(--nobg);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 16px
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .bubble {
            max-width: 82%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px
        }

        .bubble.agent {
            background: var(--agent);
            align-self: flex-start;
            border-bottom-left-radius: 4px
        }

        .bubble.user {
            background: var(--user);
            align-self: flex-end;
            border-bottom-right-radius: 4px
        }

        .bubble small {
            display: block;
            color: var(--mute);
            font-size: 11px;
            margin-bottom: 2px
        }

        .noChat {
            color: var(--mute);
            font-size: 14px
        }
    </style>
</head>

<body>
    <main>
        <header>
            <div>
                <h1>Patient bookings</h1>
                <p class="sub"><span class="dot" id="dot"></span><span id="src">Connecting…</span></p>
            </div>
            <button class="btn" id="refresh">Refresh now</button>
        </header>

        <input id="q" type="search" placeholder="Search name or phone number" aria-label="Search name or phone number">

        <div class="wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone number</th>
                        <th>Date</th>
                        <th>Time slot</th>
                    </tr>
                </thead>
                <tbody id="body"></tbody>
            </table>
            <div class="empty" id="empty" hidden>No bookings yet.</div>
            <div class="err" id="errbox" hidden></div>
        </div>
    </main>

    <div class="overlay" id="overlay" hidden>
        <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pName">
            <div class="pHead">
                <div>
                    <h2 id="pName">—</h2>
                    <p id="pPhone">—</p>
                </div>
                <button class="close" id="closeBtn" aria-label="Close">✕</button>
            </div>
            <div class="pBody">
                <div class="grid2" id="pGrid"></div>
                <p class="sectionTitle">Call summary</p>
                <div class="summary" id="pSummary"></div>
                <p class="sectionTitle">Conversation with AI</p>
                <div class="chat" id="pChat"></div>
            </div>
        </div>
    </div>

    <script>
        var $ = function (id) { return document.getElementById(id) };
        var calls = [];
        var POLL_MS = 5000;

        function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c] }) }
        function fmtDur(s) { s = +s || 0; return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s" }

        function render() {
            var q = $("q").value.toLowerCase().trim();
            var list = calls.filter(function (c) {
                return !q || ((c.name || "") + " " + (c.phone || "")).toLowerCase().indexOf(q) > -1;
            });
            $("body").innerHTML = list.map(function (c, i) {
                return '<tr><td><button class="nameBtn" data-i="' + i + '">' + esc(c.name || "Unknown") + '</button></td>' +
                    '<td class="num">' + esc(c.phone) + '</td>' +
                    '<td class="num">' + esc(c.appointment_date || "–") + '</td>' +
                    '<td class="num">' + esc(c.appointment_time || "–") + '</td></tr>';
            }).join("");
            $("empty").hidden = list.length > 0;
            Array.prototype.forEach.call(document.querySelectorAll(".nameBtn"), function (btn) {
                btn.addEventListener("click", function () { openDetail(list[+btn.dataset.i]); });
            });
        }

        function openDetail(c) {
            $("pName").textContent = c.name || "Unknown";
            $("pPhone").textContent = c.phone || "No number";
            var y = c.booked === "yes";
            $("pGrid").innerHTML = [
                ["Direction", '<span class="tag ' + (c.direction === "inbound" ? "in" : "out") + '">' + (c.direction === "inbound" ? "Inbound" : "Outbound") + '</span>'],
                ["Booking", '<span class="tag ' + (y ? "yes" : "nob") + '">' + (y ? "Booked" : "Not booked") + '</span>'],
                ["Call time", esc(c.call_time || "–")],
                ["Duration", fmtDur(c.duration_sec)],
                ["Appointment date", esc(c.appointment_date || "–")],
                ["Time slot", esc(c.appointment_time || "–")]
            ].map(function (f) { return '<div class="field"><span>' + f[0] + '</span><b>' + f[1] + '</b></div>'; }).join("");
            $("pSummary").textContent = c.notes || "No summary recorded for this call.";
            var turns = Array.isArray(c.transcript) ? c.transcript : [];
            $("pChat").innerHTML = turns.length ? turns.map(function (t) {
                var roleStr = String(t.role || "").toLowerCase();
                var isAgent = /agent|assistant|bot|ai/.test(roleStr);
                var msg = t.message || t.text || t.content || "";
                return '<div class="bubble ' + (isAgent ? "agent" : "user") + '"><small>' + (isAgent ? "AI Assistant" : "Patient") + '</small>' + esc(msg) + '</div>';
            }).join("") : '<p class="noChat">No transcript saved for this call.</p>';
            $("overlay").hidden = false;
        }
        function closeDetail() { $("overlay").hidden = true; }
        $("closeBtn").addEventListener("click", closeDetail);
        $("overlay").addEventListener("click", function (e) { if (e.target.id === "overlay") closeDetail(); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDetail(); });

        async function poll() {
            try {
                var res = await fetch("/api/calls", { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                calls = await res.json();
                $("dot").className = "dot";
                $("src").textContent = "Live — " + calls.length + " calls — updated " + new Date().toLocaleTimeString();
                $("errbox").hidden = true;
                render();
            } catch (err) {
                $("dot").className = "dot bad";
                $("src").textContent = "Connection issue, retrying…";
                $("errbox").hidden = false;
                $("errbox").textContent = "Couldn't reach the server: " + err.message;
            }
        }

        $("q").addEventListener("input", render);
        $("refresh").addEventListener("click", poll);
        poll();
        setInterval(poll, POLL_MS);
    </script>
</body>

</html>
